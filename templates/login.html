<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3T Carrier | Iniciar sesión</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="login-body">

    <div class="login-overlay"></div>

    <section class="login-hero">

        

            </div>
        </div>


        <div class="login-caja">

         <img
    src="{{ url_for('static', filename='css/IMG/logo-3t.png') }}"
    alt="Logo 3T Carrier"
    class="logo-login"
>

            <p class="subtitulo">
                Sistema Integral de Gestión Logística
            </p>

            <form action="/" method="POST">

                <div class="campo">
                    <label for="usuario">Usuario</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >
                </div>

                <div class="campo">
                    <label>Contraseña</label> 

<!-- Contenedor de la contraseña (Este es el ÚNICO input que debe existir) -->
            <div style="position: relative; width: 100%; margin-bottom: 20px;">
    
           <input type="password" name="password" id="campoContrasena" required style="width: 100%; padding-right: 40px; box-sizing: border-box; padding-top: 10px; padding-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
    
            <span onclick="alternarContrasena()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #6c757d; display: flex; align-items: center;">
         <svg id="iconoOjo" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
            </svg>
            </span>
    
                </div>

                <button type="submit" class="boton-login">
                    Iniciar sesión →
                </button>

            </form>

            <div class="separador"></div>

            <p class="frase-login">
                Transporte que conecta tu mundo
            </p>

        </div>

    </section>

        <script>
    function alternarContrasena() {
        var campo = document.getElementById("campoContrasena");
        var icono = document.getElementById("iconoOjo");
        
        if (campo.type === "password") {
            campo.type = "text";
            // Cambia el ícono a un ojo tachado
            icono.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            campo.type = "password";
            // Regresa al ícono del ojo normal
            icono.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }
</script>
</body>
</html>
