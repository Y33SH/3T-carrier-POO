<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3T Carrier | Nueva unidad</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/estilos.css') }}">
</head>

<body class="dashboard-body">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <img
                src="{{ url_for('static', filename='css/IMG/logo-3t.png') }}"
                alt="Logo 3T Carrier"
            >
        </div>

        <nav class="sidebar-menu">
            <a href="/dashboard">🏠 Dashboard</a>
            <a href="/clientes">👥 Clientes</a>
            <a href="/pedidos">📦 Pedidos</a>
            <a href="/operadores">👷 Operadores</a>
            <a href="/unidades" class="activo">🚚 Unidades</a>
            <a href="/asignaciones">🔗 Asignaciones</a>
            <a href="/seguimiento">📍 Seguimiento</a>
            <a href="/incidencias">⚠️ Incidencias</a>
        </nav>

        <div class="sidebar-footer">
            <a href="/">Cerrar sesión</a>
        </div>

    </aside>

    <main class="dashboard-contenido">

        <header class="dashboard-header">

            <div>
                <h1>Nueva unidad</h1>
                <p>Registrar una nueva unidad de transporte</p>
            </div>

            <a href="/unidades" class="boton-secundario">
                ← Volver
            </a>

        </header>

        <section class="formulario-contenedor">

            <form>

                <div class="form-grid">

                    <div class="campo-form">
                        <label for="numero_economico">
                            Número económico
                        </label>

                        <input
                            type="text"
                            id="numero_economico"
                            name="numero_economico"
                            placeholder="Ej. 3T-001"
                            required
                        >
                    </div>

                    <div class="campo-form">
                        <label for="placas">
                            Placas
                        </label>

                        <input
                            type="text"
                            id="placas"
                            name="placas"
                            placeholder="Ej. ABC-123-A"
                            required
                        >
                    </div>

                    <div class="campo-form">
                        <label for="marca">
                            Marca
                        </label>

                        <input
                            type="text"
                            id="marca"
                            name="marca"
                            placeholder="Ej. Freightliner"
                        >
                    </div>

                    <div class="campo-form">
                        <label for="modelo">
                            Modelo
                        </label>

                        <input
                            type="text"
                            id="modelo"
                            name="modelo"
                            placeholder="Ej. Cascadia 2025"
                        >
                    </div>

                    <div class="campo-form">
                        <label for="capacidad">
                            Capacidad
                        </label>

                        <input
                            type="number"
                            id="capacidad"
                            name="capacidad"
                            placeholder="Ej. 25000"
                            min="0"
                            step="0.01"
                        >
                    </div>

                    <div class="campo-form">
                        <label for="ubicacion_actual">
                            Ubicación actual
                        </label>

                        <input
                            type="text"
                            id="ubicacion_actual"
                            name="ubicacion_actual"
                            placeholder="Ej. Patio Monterrey"
                        >
                    </div>

                    <div class="campo-form campo-completo">
                        <label for="estado">
                            Estado de la unidad
                        </label>

                        <select
                            id="estado"
                            name="estado"
                            required
                        >
                            <option value="DISPONIBLE">
                                Disponible
                            </option>

                            <option value="EN RUTA">
                                En ruta
                            </option>

                            <option value="MANTENIMIENTO">
                                Mantenimiento
                            </option>

                            <option value="FUERA DE SERVICIO">
                                Fuera de servicio
                            </option>
                        </select>
                    </div>

                </div>

                <div class="form-acciones">

                    <a href="/unidades" class="boton-cancelar">
                        Cancelar
                    </a>

                    <button type="submit" class="boton-guardar">
                        Guardar unidad
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
